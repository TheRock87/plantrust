[project]
name = "plantrust"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.2",
    "langchain-mistralai>=1.2.0",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "rapidfuzz>=3.14.6",
    "shapely>=2.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
