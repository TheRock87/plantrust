<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 930" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="960" height="930" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#222">PlanTrust v2: the agent fixes the plan, the drafter approves</text>

  <!-- Layer 0 -->
  <rect x="20" y="56" width="920" height="120" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="36" y="80" font-weight="700" fill="#374151">Layer 0: three witnesses for every room</text>
  <rect x="40" y="92" width="270" height="70" rx="8" fill="#fff" stroke="#dc2626"/>
  <text x="175" y="116" text-anchor="middle" font-weight="700" fill="#b91c1c">AI PLAN (the draft)</text>
  <text x="175" y="140" text-anchor="middle">shapes, ceiling, doors, wet or not</text>
  <rect x="345" y="92" width="270" height="70" rx="8" fill="#fff" stroke="#2563eb"/>
  <text x="480" y="116" text-anchor="middle" font-weight="700" fill="#1d4ed8">TOUR</text>
  <text x="480" y="140" text-anchor="middle">measured walls, ceiling, door count</text>
  <rect x="650" y="92" width="270" height="70" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="785" y="116" text-anchor="middle" font-weight="700" fill="#6d28d9">NEW: TECHNICIAN NOTES</text>
  <text x="785" y="140" text-anchor="middle">"water got under the hall carpet too"</text>

  <line x1="480" y1="176" x2="480" y2="204" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <!-- Layer 1 -->
  <rect x="20" y="206" width="920" height="132" rx="12" fill="#ecfdf5" stroke="#86efac"/>
  <text x="36" y="230" font-weight="700" fill="#166534">Layer 1: CODE finds problems, and fixes the ones a rule can fix (free, exact)</text>
  <text x="44" y="256">Wall more than 5% off the tour</text>
  <text x="520" y="256" font-weight="700" fill="#15803d">propose: set wall to the tour length</text>
  <text x="44" y="280">Ceiling more than 1 ft off the tour</text>
  <text x="520" y="280" font-weight="700" fill="#15803d">propose: set ceiling to the tour value</text>
  <text x="44" y="304">Overlap, and this room's walls disagree with its tour</text>
  <text x="520" y="304" font-weight="700" fill="#15803d">propose: same wall fix (removes the overlap)</text>
  <text x="44" y="328">Door conflict, wet-status question, notes that change the room</text>
  <text x="520" y="328" font-weight="700" fill="#b45309">hand to the agent</text>

  <line x1="480" y1="338" x2="480" y2="366" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <!-- Layer 2 -->
  <rect x="20" y="368" width="920" height="176" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="36" y="392" font-weight="700" fill="#92400e">Layer 2: the AGENT acts where words decide (free model: Mistral voxtral-small)</text>
  <text x="44" y="418">Read tools: get_room, get_tour, get_notes</text>
  <text x="44" y="442">Action tools (DRAFT copy only): add_door, mark_wet.  End: no_change, ask_drafter</text>
  <text x="44" y="470">Example: plan 1 door, tour 2. Notes: "second opening is an archway, no door" -&gt; keep plan, no edit.</text>
  <text x="44" y="494">Example: plan says hall not wet. Notes: "hall carpet soaked" -&gt; mark_wet(hall) -&gt; $ added to estimate.</text>
  <text x="44" y="522">Each edit must quote its note. CODE checks the quote; a made-up quote is blocked.</text>

  <line x1="480" y1="544" x2="480" y2="572" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <!-- Layer 3 -->
  <rect x="20" y="574" width="920" height="130" rx="12" fill="#fdf2f8" stroke="#f9a8d4"/>
  <text x="36" y="598" font-weight="700" fill="#9d174d">Layer 3: DRAFTER QUEUE (human in the loop): no edit reaches the final plan without a person</text>
  <text x="44" y="624">Every proposed edit pauses (LangChain HumanInTheLoopMiddleware). The drafter sees the change,</text>
  <text x="44" y="648">the evidence and the dollars, then clicks:</text>
  <rect x="330" y="634" width="96" height="26" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="378" y="652" text-anchor="middle" font-weight="700" fill="#15803d">Approve</text>
    <rect x="440" y="634" width="96" height="26" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="488" y="652" text-anchor="middle" font-weight="700" fill="#b91c1c">Reject</text>
  <text x="44" y="688" fill="#6b7280">In the test run, a simulated drafter (who knows the truth) answers, so every number is measured.</text>

  <line x1="480" y1="704" x2="480" y2="732" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <!-- Layer 4 -->
  <rect x="20" y="734" width="920" height="180" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="36" y="758" font-weight="700" fill="#1e40af">Layer 4: MEASURE and LEARN</text>
  <text x="44" y="784">Approved · rejected · missed · harmful edits (changed a correct room: must be 0)</text>
  <text x="44" y="808">Dollars still at risk after approved fixes · model called for N of M rooms</text>
  <text x="44" y="832">Compare on the same rooms: code fixes only · keyword search on notes · code + agent.</text>
  <text x="44" y="862" font-weight="700" fill="#1e40af">Autonomy ladder: a fix type is auto-applied only after the drafter approved it</text>
  <text x="44" y="886" font-weight="700" fill="#1e40af">on enough cases (e.g. 95% of at least 20). Everything else keeps the human check.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
